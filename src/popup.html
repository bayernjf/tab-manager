<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Tab Garden</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main id="auth-view" class="auth-view">
    <div class="auth-brand"><span class="brand-mark">TG</span><span class="eyebrow">TAB GARDEN</span><h1>欢迎来到标签花园</h1><p>登录后开始整理你的浏览空间</p></div>
    <form id="auth-form" class="auth-card">
      <div class="auth-tabs" role="tablist"><button id="login-tab" class="auth-tab active" type="button">登录</button><button id="signup-tab" class="auth-tab" type="button">注册</button></div>
      <label class="field"><span>邮箱</span><input id="auth-email" type="email" autocomplete="email" placeholder="you@example.com" required></label>
      <label class="field"><span>密码</span><input id="auth-password" type="password" autocomplete="current-password" placeholder="至少 6 位" minlength="6" required></label>
      <label id="confirm-field" class="field hidden"><span>确认密码</span><input id="auth-confirm" type="password" autocomplete="new-password" placeholder="再次输入密码" minlength="6"></label>
      <button id="auth-submit" class="primary auth-submit" type="submit">登录</button>
      <p id="auth-status" class="auth-message" aria-live="polite"></p>
    </form>
  </main>

  <main id="app-view" class="hidden">
  <header>
    <div><span class="eyebrow">TAB GARDEN</span><h1>标签花园</h1></div>
    <div class="header-actions"><button id="open-board" class="ghost" title="打开标签看板">看板</button><button id="logout" class="ghost" title="退出登录">退出</button></div>
  </header>

  <section class="settings-card">
    <label class="switch-row"><span><strong>看板自动分组</strong><small>仅在扩展看板中按网站聚合，不修改浏览器标签</small></span><input id="auto-toggle" type="checkbox"><i></i></label>
    <label class="threshold"><span>达到</span><select id="minimum-tabs"><option value="2">2</option><option value="3">3</option><option value="4">4</option></select><span>个标签页时在看板中聚合</span></label>
  </section>

  <section>
    <div class="section-title"><h2>创建自定义分组</h2><button id="select-all" class="link">全选</button></div>
    <div id="tabs-list" class="tabs-list"></div>
    <div class="create-row">
      <input id="group-name" maxlength="40" placeholder="分组名称">
      <select id="group-color" aria-label="分组颜色"><option value="blue">蓝色</option><option value="green">绿色</option><option value="purple">紫色</option><option value="orange">橙色</option><option value="red">红色</option><option value="pink">粉色</option><option value="cyan">青色</option><option value="yellow">黄色</option><option value="grey">灰色</option></select>
      <button id="create-group" class="primary">创建</button>
    </div>
  </section>

  <section>
    <div class="section-title"><h2>自定义分组</h2></div>
    <div id="groups-list"></div>
  </section>
  <p id="status" class="status" aria-live="polite"></p>
  </main>
  <script type="module" src="popup.js"></script>
</body>
</html>
