<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>标签看板 - Tab Garden</title>
  <link rel="stylesheet" href="board.css">
</head>
<body>
  <main class="board-shell">
    <header class="board-header">
      <div class="board-header-left">
        <div><h1 data-i18n="tabBoard">标签看板</h1></div>
        <div id="board-stats-inline" class="board-stats-inline"></div>
      </div>
      <div class="board-actions">
        <button id="board-theme-toggle" class="icon-button theme-toggle" type="button" data-i18n="themeToggle|aria-label" aria-label="切换主题" aria-pressed="false"><span aria-hidden="true">🌓</span></button>
        <button id="view-toggle-board" class="button secondary view-toggle" type="button" data-i18n="boardView" aria-pressed="true">看板</button>
        <button id="view-toggle-timeline" class="button secondary view-toggle" type="button" data-i18n="timelineView" aria-pressed="false">时间线</button>
        <button id="toggle-select-mode" class="button secondary" type="button" data-i18n="selectMode">批量选择</button>
        <button id="recently-closed-btn" class="button secondary" type="button" data-i18n="recentlyClosed">最近关闭</button>
        <button id="memory-usage-btn" class="button secondary" type="button" data-i18n="memoryUsage">内存占用</button>
        <label class="auto-fill has-tooltip" id="auto-fill-wrapper">
          <input id="auto-fill" type="checkbox" checked>
          <span data-i18n="autoFill">自动填充</span>
          <span class="tooltip" role="tooltip" data-i18n="autoFillHint">关闭后分组卡保持当前手动排列位置，不按顺序自动补位填满</span>
        </label>
        <button id="open-workspaces" class="button secondary" type="button" data-i18n="workspaces">工作区</button>
        <button id="review-duplicates" class="button secondary" type="button" data-i18n="reviewDuplicates">检查重复</button>
        <button id="refresh" class="button secondary" type="button" data-i18n="refresh">刷新</button>
      </div>
    </header>
    <section id="login-required" class="login-required hidden" aria-labelledby="login-title">
      <h2 id="login-title" data-i18n="loginRequired">需要登录</h2>
      <p id="login-message" data-i18n="loginMessage">请先登录后使用标签看板。</p>
    </section>
    <section id="board-content" class="hidden" aria-label="标签看板">
      <section id="deferred-reminders" class="deferred-reminders hidden" aria-labelledby="deferred-title"><h2 id="deferred-title" data-i18n="deferredReminders">待恢复提醒</h2><div id="deferred-list"></div></section>
      <div id="batch-action-bar" class="batch-action-bar hidden" role="toolbar" aria-label="批量操作">
        <label class="batch-select-all-wrapper"><input id="batch-select-all" type="checkbox"><span data-i18n="selectAllTabs">全选</span></label>
        <span id="batch-selected-count" class="batch-selected-count" data-i18n="selectedCount">已选 0 个标签</span>
        <div class="batch-actions">
          <button id="batch-close-btn" class="button secondary" type="button" data-i18n="batchClose">批量关闭</button>
          <button id="batch-defer-btn" class="button secondary" type="button" data-i18n="batchDefer">批量稍后处理</button>
          <button id="batch-move-btn" class="button secondary" type="button" data-i18n="batchMoveTo">移动到分组</button>
          <button id="exit-select-mode" class="button secondary" type="button" data-i18n="exitSelectMode">退出选择</button>
        </div>
      </div>
      <div id="timeline-toolbar" class="timeline-toolbar hidden">
        <label class="timeline-sort-label"><span data-i18n="timelineByCreated">排序方式</span>
          <select id="timeline-sort">
            <option value="created" data-i18n="timelineByCreated">按创建时间</option>
            <option value="due" data-i18n="timelineByDue">按提醒时间</option>
          </select>
        </label>
      </div>
      <div class="board-toolbar">
        <div class="toolbar-filters" role="search">
          <label><span class="sr-only">搜索标签</span><input id="board-search" type="search" data-i18n="searchTabs|placeholder" placeholder="搜索标题、网址或域名" autocomplete="off"></label>
          <label><span class="sr-only">来源窗口</span><select id="window-filter" aria-label="来源窗口"><option value="" data-i18n="allWindows">全部窗口</option></select></label>
        </div>
        <div id="new-group-wrapper" class="toolbar-new-group">
          <button id="new-group-toggle" class="button secondary" type="button" data-i18n="createNewGroup">新建分组</button>
          <form id="new-group-form" class="new-group-fields hidden">
            <label><span class="sr-only">新分组名称</span><input id="new-group-title" maxlength="40" required data-i18n="newGroupPlaceholder|placeholder" placeholder="新建自定义分组"></label>
            <label><span class="sr-only">分组颜色</span><select id="new-group-color" aria-label="分组颜色"><option value="blue" data-i18n="blue">蓝色</option><option value="green" data-i18n="green">绿色</option><option value="purple" data-i18n="purple">紫色</option><option value="orange" data-i18n="orange">橙色</option><option value="red" data-i18n="red">红色</option><option value="pink" data-i18n="pink">粉色</option><option value="cyan" data-i18n="cyan">青色</option><option value="yellow" data-i18n="yellow">黄色</option><option value="grey" data-i18n="grey">灰色</option></select></label>
            <button class="button" type="submit" data-i18n="createNewGroup">新建分组</button>
            <button id="new-group-cancel" class="button secondary" type="button" data-i18n="cancel">取消</button>
          </form>
        </div>
        <nav id="scope-nav" class="scope-nav" aria-label="看板范围"></nav>
      </div>
      <div id="workspace-header" class="workspace-header hidden" aria-live="polite"></div>
      <div id="board-grid" class="board-grid" aria-live="polite"></div>
    </section>
  </main>
  <dialog id="workspace-dialog" class="workspace-dialog workspace-dialog-resizable" aria-labelledby="workspace-title">
    <div class="workspace-dialog-header">
      <h2 id="workspace-title" data-i18n="localWorkspace">本地工作区</h2>
      <button id="close-workspace-dialog" class="icon-button" type="button" data-i18n="closeWorkspace|aria-label" aria-label="关闭工作区">×</button>
    </div>
    <div class="workspace-device-bar">
      <span class="workspace-device-prefix" data-i18n="thisDevice">本设备</span>
      <input id="workspace-device-name" class="workspace-device-input" type="text" maxlength="60" aria-label="本设备名称" spellcheck="false">
    </div>
    <div class="workspace-dialog-body">
      <div class="workspace-dialog-left">
        <div class="workspace-controls">
          <div class="workspace-name-field">
            <input id="workspace-name" maxlength="80" data-i18n="workspaceNamePlaceholder|placeholder" placeholder="工作区名称" aria-describedby="workspace-name-error" aria-invalid="false">
            <p id="workspace-name-error" class="workspace-name-toast" role="alert" hidden></p>
          </div>
        </div>
        <label class="workspace-select-all"><input id="workspace-select-all" type="checkbox" checked><span data-i18n="selectAll">全选</span></label>
        <div id="workspace-tabs" class="workspace-tabs"></div>
        <button id="save-workspace" class="button" type="button" data-i18n="saveSelectedTabs">保存选中标签</button>
      </div>
      <div class="workspace-dialog-resizer" aria-hidden="true"></div>
      <div class="workspace-dialog-right">
        <h3 class="workspace-list-title" data-i18n="workspaces">工作区</h3>
        <div id="workspace-list" class="workspace-list"></div>
      </div>
    </div>
  </dialog>
  <dialog id="workspace-restore-dialog" class="workspace-dialog" aria-labelledby="workspace-restore-title">
    <h2 id="workspace-restore-title" data-i18n="restoreWorkspace">恢复工作区</h2><p id="workspace-restore-summary"></p><div id="workspace-restore-list" class="workspace-tabs workspace-restore-list"></div>
    <div class="workspace-restore-actions"><button id="cancel-workspace-restore" class="button secondary" type="button" data-i18n="cancel">取消</button><button id="confirm-workspace-restore" class="button" type="button" data-i18n="confirm">确认</button></div>
  </dialog>
  <dialog id="duplicate-review-dialog" class="duplicate-review" aria-labelledby="duplicate-review-title">
    <header class="duplicate-review-header">
      <div><span class="eyebrow">TAB GARDEN</span><h2 id="duplicate-review-title" data-i18n="duplicateReview">重复标签预览</h2></div>
      <button id="close-duplicate-review" class="icon-button" type="button" data-i18n="closeDuplicateReview|aria-label" aria-label="关闭重复标签预览">×</button>
    </header>
    <p id="duplicate-review-summary" class="duplicate-review-summary"></p>
    <div id="duplicate-review-list" class="duplicate-review-list"></div>
    <footer class="duplicate-review-actions">
      <button id="cancel-duplicate-review" class="button secondary" type="button" data-i18n="cancel">取消</button>
      <button id="confirm-duplicate-review" class="button" type="button" disabled data-i18n="closeDuplicateTabs">关闭重复标签</button>
    </footer>
  </dialog>
  <dialog id="last-tab-confirm-dialog" class="duplicate-review last-tab-confirm-dialog" aria-labelledby="last-tab-confirm-title">
    <header class="duplicate-review-header">
      <div><span class="eyebrow">TAB GARDEN</span><h2 id="last-tab-confirm-title" data-i18n="deleteConfirm">删除确认</h2></div>
    </header>
    <p class="duplicate-review-summary" data-i18n="workspaceWillBeDeleted">该工作区也将被删除</p>
    <footer class="duplicate-review-actions">
      <button id="cancel-last-tab-confirm" class="button secondary" type="button" data-i18n="cancel">取消</button>
      <button id="confirm-last-tab-confirm" class="button" type="button" data-i18n="delete">删除</button>
    </footer>
  </dialog>
  <dialog id="recently-closed-dialog" class="duplicate-review" aria-labelledby="recently-closed-title">
    <header class="duplicate-review-header">
      <div><span class="eyebrow">TAB GARDEN</span><h2 id="recently-closed-title" data-i18n="recentlyClosedTitle">最近关闭的标签</h2></div>
      <button id="close-recently-closed" class="icon-button" type="button" data-i18n="closeDuplicateReview|aria-label" aria-label="关闭最近关闭">×</button>
    </header>
    <div id="recently-closed-list" class="duplicate-review-list"></div>
    <footer class="duplicate-review-actions">
      <button id="cancel-recently-closed" class="button secondary" type="button" data-i18n="cancel">取消</button>
    </footer>
  </dialog>
  <dialog id="memory-usage-dialog" class="duplicate-review" aria-labelledby="memory-title">
    <header class="duplicate-review-header">
      <div><span class="eyebrow">TAB GARDEN</span><h2 id="memory-title" data-i18n="memoryTitle">内存占用排序</h2></div>
      <button id="close-memory-usage" class="icon-button" type="button" aria-label="关闭内存占用">×</button>
    </header>
    <div id="memory-usage-list" class="duplicate-review-list"></div>
    <footer class="duplicate-review-actions">
      <button id="close-top-memory" class="button secondary" type="button" data-i18n="closeTopUsers">关闭占用前 5 的标签</button>
      <button id="cancel-memory-usage" class="button secondary" type="button" data-i18n="cancel">取消</button>
    </footer>
  </dialog>
  <dialog id="batch-move-dialog" class="duplicate-review" aria-labelledby="batch-move-title">
    <header class="duplicate-review-header">
      <div><span class="eyebrow">TAB GARDEN</span><h2 id="batch-move-title" data-i18n="batchMoveTo">移动到分组</h2></div>
      <button id="close-batch-move" class="icon-button" type="button" aria-label="关闭移动到分组">×</button>
    </header>
    <div id="batch-move-list" class="duplicate-review-list"></div>
    <footer class="duplicate-review-actions">
      <button id="cancel-batch-move" class="button secondary" type="button" data-i18n="cancel">取消</button>
    </footer>
  </dialog>
  <script type="module" src="board.js"></script>
</body>
</html>
