name: CI

on:
  pull_request:
    branches:
      - main
      - dev
  push:
    branches:
      - main
      - dev
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, test, and build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prepare non-production build config
        run: cp .env.example .env.local

      - name: Typecheck
        run: npm run typecheck

      - name: Test and build
        run: npm test

      - name: Upload extension build
        uses: actions/upload-artifact@v4
        with:
          name: tab-garden-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 7
